workflows:
  ios-workflow:
    name: RupeeWise iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 16.0
      node: 22
      cocoapods: default
    scripts:
      - name: Install and Sync
        script: |
          npm install
          npx --yes @capacitor/cli sync ios
      - name: Install Pods
        script: |
          cd ios/App
          if [ -f Podfile ]; then pod install; else echo "No Podfile"; fi
          cd ../..
      - name: Build iOS Simulator App
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -sdk iphonesimulator -configuration Debug -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build
          ls -R build/ || true
          cd ../..
    artifacts:
      - ios/App/build/Build/Products/Debug-iphonesimulator/App.app
      - ios/App/build/**/*.app
