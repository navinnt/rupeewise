workflows:
  ios-workflow:
    name: RupeeWise iOS Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: 16.0
      node: 20
      cocoapods: default
    scripts:
      - name: Install and Sync
        script: |
          npm install
          npx --yes @capacitor/cli sync ios
      - name: Install Pods
        script: |
          cd ios/App && pod install && cd ../..
      - name: Build iOS
        script: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -archivePath build/App.xcarchive archive || true
          cd ../..
    artifacts:
      - ios/App/build/App.xcarchive
